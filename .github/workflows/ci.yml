name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libxrandr-dev libxcursor-dev libxi-dev libudev-dev
          libgl1-mesa-dev libegl1-mesa-dev
          libfreetype-dev libharfbuzz-dev

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --config Release --prefix ./package

      - name: Rename binary for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd package/bin
          zip -r sfml-template-${{ github.ref_name }}-${{ matrix.name }}-x86_64.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: sfml-template-${{ matrix.name }}
          path: package/bin/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
