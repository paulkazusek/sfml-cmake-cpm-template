name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libxrandr-dev libxcursor-dev libxi-dev libudev-dev
          libgl1-mesa-dev libegl1-mesa-dev
          libfreetype-dev libharfbuzz-dev

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --config Release --prefix ./package

      - name: Rename binary for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd package/bin
          ext=""
          [ "${{ runner.os }}" == "Windows" ] && ext=".exe"
          mv sfml-template${ext} sfml-template-${{ github.ref_name }}-${{ matrix.name }}-x86_64${ext}

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: sfml-template-${{ matrix.name }}
          path: package/bin/sfml-template*

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: package/bin/sfml-template-*
